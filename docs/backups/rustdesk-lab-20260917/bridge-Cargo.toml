[package]
name = "rustdesk-controller-bridge"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[dependencies]
axum = "0.8"
base64 = "0.22"
librustdesk = { package = "rustdesk", path = "../rustdesk-research", default-features = false, features = ["linux-pkg-config"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
uuid = { version = "1", features = ["v4"] }
