name: One-shot UI model fix
on: push
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/bot/menus/settings-menu.ts'); s=p.read_text()
          old='''        "🧵 <b>Topic Settings</b>",\n        "",\n        "✨ <b>Your Topic, your rules.</b>",\n        "Customize how this Topic thinks, responds, and behaves.",\n        "",\n        "🤖 <b>Model</b>",\n        `<code>${model}</code>`,\n        `🧑‍💻 <b>Agent</b> · ${agent}`,\n        `🎛 <b>Variant</b> · ${variant}`,\n        "",\n        "💬 <b>Response</b> · Output & thinking",\n        `📥 <b>Prompt Queue</b> · ${statusPill(getPromptQueueEnabled())}`,\n        "🧠 <b>Context Health</b> · Token usage & window",'''
          new='''        "🧵 <b>Topic Settings</b>",\n        "",\n        `<code>${model}</code>`,\n        "",\n        `🤖 <b>Model</b> · ${model}`,\n        `🧑‍💻 <b>Agent</b> · ${agent}`,\n        `🎛 <b>Variant</b> · ${variant}`,\n        "",\n        "💬 <b>Response & Output</b>",\n        `📥 <b>Prompt Queue</b> · ${statusPill(getPromptQueueEnabled())}`,\n        "🧠 <b>Context Health</b>",'''
          assert old in s; p.write_text(s.replace(old,new,1))
          p=Path('src/bot/commands/providers-command.ts'); s=p.read_text()
          pattern=re.compile(r'async function getProviderCapabilitySummary\(customProviders: Awaited<ReturnType<typeof listCustomProviders>>\) \{.*?\n\}',re.S)
          repl='''async function getProviderCapabilitySummary(customProviders: Awaited<ReturnType<typeof listCustomProviders>>) {\n  const [imageProviders, groq] = await Promise.all([listImageAiProviders(), getGroqSttConfig()]);\n  const lines: string[] = [];\n  for (const capability of CAPABILITIES) {\n    if (capability === "image") {\n      const cloudflare = imageProviders.find((provider) => provider.id === IMAGE_AI_PROVIDER_IDS.CLOUDFLARE_ID);\n      const custom = imageProviders.find((provider) => provider.id === IMAGE_AI_PROVIDER_IDS.CUSTOM_ID && provider.active);\n      const configured = Boolean(custom) || Boolean(cloudflare && (await validateConfiguredCloudflareCredentials()).valid);\n      lines.push(`${LABEL[capability]}: ${configured ? "✅" : "⚪ Not configured"}`);\n      continue;\n    }\n    const configured = capability === "stt" ? Boolean(groq) || customProviders.some((provider) => provider.capability === capability) : customProviders.some((provider) => provider.capability === capability);\n    lines.push(`${LABEL[capability]}: ${configured ? "✅" : "⚪ Not configured"}`);\n  }\n  return lines;\n}'''
          s,n=pattern.subn(repl,s,1); assert n==1; p.write_text(s)
          Path('.github/workflows/_ui_model_fix.yml').unlink()
          PY
      - name: Commit fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet || git commit -m 'fix: simplify topic settings and provider status UI'
          git push