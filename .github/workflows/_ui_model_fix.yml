name: One-shot UI model fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: contains(github.event.head_commit.message, 'chore: add one-shot UI model fix runner')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          settings = Path('src/bot/menus/settings-menu.ts')
          text = settings.read_text()
          old = '''        "🧵 <b>Topic Settings</b>",
        "",
        "✨ <b>Your Topic, your rules.</b>",
        "Customize how this Topic thinks, responds, and behaves.",
        "",
        "🤖 <b>Model</b>",
        `<code>${model}</code>`,
        `🧑‍💻 <b>Agent</b> · ${agent}`,
        `🎛 <b>Variant</b> · ${variant}`,
        "",
        "💬 <b>Response</b> · Output & thinking",
        `📥 <b>Prompt Queue</b> · ${statusPill(getPromptQueueEnabled())}`,
        "🧠 <b>Context Health</b> · Token usage & window",'''
          new = '''        "🧵 <b>Topic Settings</b>",
        "",
        `<code>${model}</code>`,
        "",
        `🤖 <b>Model</b> · ${model}`,
        `🧑‍💻 <b>Agent</b> · ${agent}`,
        `🎛 <b>Variant</b> · ${variant}`,
        "",
        "💬 <b>Response & Output</b>",
        `📥 <b>Prompt Queue</b> · ${statusPill(getPromptQueueEnabled())}`,
        "🧠 <b>Context Health</b>",'''
          if old not in text:
              raise SystemExit('settings root block not found')
          settings.write_text(text.replace(old, new, 1))

          providers = Path('src/bot/commands/providers-command.ts')
          text = providers.read_text()
          pattern = re.compile(r'async function getProviderCapabilitySummary\(customProviders: Awaited<ReturnType<typeof listCustomProviders>>\) \{.*?\n\}', re.S)
          replacement = '''async function getProviderCapabilitySummary(customProviders: Awaited<ReturnType<typeof listCustomProviders>>) {
            const [imageProviders, groq] = await Promise.all([listImageAiProviders(), getGroqSttConfig()]);
            const lines: string[] = [];
            for (const capability of CAPABILITIES) {
              if (capability === "image") {
                const cloudflare = imageProviders.find((provider) => provider.id === IMAGE_AI_PROVIDER_IDS.CLOUDFLARE_ID);
                const custom = imageProviders.find((provider) => provider.id === IMAGE_AI_PROVIDER_IDS.CUSTOM_ID && provider.active);
                const configured = (cloudflare && (await validateConfiguredCloudflareCredentials()).valid) || Boolean(custom);
                lines.push(`${LABEL[capability]}: ${configured ? "✅" : "⚪ Not configured"}`);
                continue;
              }
              const configured = capability === "stt"
                ? Boolean(groq) || customProviders.some((provider) => provider.capability === capability)
                : customProviders.some((provider) => provider.capability === capability);
              lines.push(`${LABEL[capability]}: ${configured ? "✅" : "⚪ Not configured"}`);
            }
            return lines;
          }'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('provider summary function not found')
          providers.write_text(text)

          workflow = Path('.github/workflows/_ui_model_fix.yml')
          workflow.unlink()

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/bot/menus/settings-menu.ts src/bot/commands/providers-command.ts .github/workflows/_ui_model_fix.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: simplify topic settings and provider status UI"
          git push
