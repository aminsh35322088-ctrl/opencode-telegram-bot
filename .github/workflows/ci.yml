name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, Typecheck, Build, Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Changelog policy
        if: github.event_name == 'pull_request'
        run: npm run check:changelog

      - name: Materialize CI-only test suite
        run: |
          cp -a .github/ci-tests/tests ./tests
          cp .github/ci-tests/tsconfig.test.json ./tsconfig.test.json
          cp .github/ci-tests/vitest.config.ts ./vitest.config.ts

      - name: Lint
        run: |
          npm run lint
          npx eslint tests --max-warnings=0

      - name: Typecheck
        run: |
          npm run typecheck
          npx tsc -p tsconfig.test.json --noEmit

      - name: Build
        run: npm run build

      - name: Test
        run: npx vitest run

      - name: Remove materialized test suite
        if: always()
        run: |
          rm -rf tests tsconfig.test.json vitest.config.ts
