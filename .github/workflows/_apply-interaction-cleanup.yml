name: _apply-interaction-cleanup

on:
  push:
    branches:
      - fix/interaction-permission-question-races

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch interaction cleanup and question replacement
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/bot/services/event-subscription-service.ts")
          text = path.read_text()

          old = '''    summaryAggregator.setOnCleared(() => {\n      this.toolMessageBatcher.clearAll("summary_aggregator_clear");'''
          new = '''    summaryAggregator.setOnCleared(() => {\n      interactionEventGate.clear();\n      this.toolMessageBatcher.clearAll("summary_aggregator_clear");'''
          if old in text and new not in text:
              text = text.replace(old, new, 1)

          old = '''      if (questionManager.isActive()) {\n        logger.warn("[Bot] Replacing active poll with a new one");\n\n        const previousMessageIds = questionManager.getMessageIds();'''
          new = '''      if (questionManager.isActive()) {\n        const previousRequestID = questionManager.getRequestID();\n        const previousMessageIds = questionManager.getMessageIds();\n        logger.warn(\n          `[Bot] Replacing active poll with a new one: previousRequestID=${previousRequestID ?? "none"}, newRequestID=${requestID}`,\n        );'''
          if old in text:
              text = text.replace(old, new, 1)

          old = '''        clearAllInteractionState("question_replaced_by_new_poll");\n      }\n\n      logger.info(`[Bot] Received ${questions.length} questions from agent, requestID=${requestID}`);'''
          new = '''        const currentProject = getCurrentProject();\n        const currentSessionForReject = getCurrentSession();\n        const directoryForReject =\n          currentSessionForReject?.directory ?? currentProject?.worktree;\n        if (previousRequestID && directoryForReject) {\n          try {\n            const response = await opencodeClient.question.reject({\n              requestID: previousRequestID,\n              directory: directoryForReject,\n            });\n            if (response.error) {\n              logger.warn(\n                `[Bot] Failed to reject replaced question ${previousRequestID}:`,\n                response.error,\n              );\n            } else {\n              logger.info(\n                `[Bot] Rejected replaced question: requestID=${previousRequestID}`,\n              );\n            }\n          } catch (error) {\n            logger.warn(\n              `[Bot] Exception rejecting replaced question ${previousRequestID}:`,\n              error,\n            );\n          }\n        }\n\n        clearAllInteractionState("question_replaced_by_new_poll");\n      }\n\n      logger.info(`[Bot] Received ${questions.length} questions from agent, requestID=${requestID}`);'''
          if old in text:
              text = text.replace(old, new, 1)

          old = '''    summaryAggregator.setOnSessionError(async (sessionId, message) => {\n      if (!this.botInstance || !this.chatIdInstance) {'''
          if old in text:
              replacement = '''    summaryAggregator.setOnSessionError(async (sessionId, message) => {\n      interactionEventGate.clearSession(sessionId);\n\n      if (!this.botInstance || !this.chatIdInstance) {'''
              text = text.replace(old, replacement, 1)
          else:
              # Current implementation is split/structured differently; patch the callback body by anchor.
              anchor = '''    summaryAggregator.setOnSessionError(async (sessionId, message) => {'''
              if anchor in text and 'interactionEventGate.clearSession(sessionId);' not in text[text.index(anchor):text.index(anchor)+400]:
                  text = text.replace(anchor, anchor + '''\n      interactionEventGate.clearSession(sessionId);''', 1)

          anchor = '''    summaryAggregator.setOnSessionIdle(async (sessionId) => {'''
          if anchor in text and 'interactionEventGate.clearSession(sessionId);' not in text[text.index(anchor):text.index(anchor)+300]:
              text = text.replace(anchor, anchor + '''\n      interactionEventGate.clearSession(sessionId);''', 1)

          path.write_text(text)
          Path(".github/workflows/_apply-interaction-cleanup.yml").unlink(missing_ok=True)

      - name: Commit patched files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/bot/services/event-subscription-service.ts .github/workflows/_apply-interaction-cleanup.yml
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "fix: clean interaction gates and reject replaced questions"
          git push
