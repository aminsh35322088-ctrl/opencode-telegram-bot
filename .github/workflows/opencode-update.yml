name: Update OpenCode stable version

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check latest OpenCode release
        id: version
        shell: bash
        run: |
          set -euo pipefail
          latest="$(npm view opencode-ai version)"
          current="$(tr -d '\r\n' < .opencode-version)"
          echo "Current: ${current}"
          echo "Latest:  ${latest}"
          echo "latest=${latest}" >> "$GITHUB_OUTPUT"
          if [ "$latest" = "$current" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update version and trigger Railway deployment
        if: steps.version.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "${{ steps.version.outputs.latest }}" > .opencode-version
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .opencode-version
          git commit -m "chore: update OpenCode to ${{ steps.version.outputs.latest }}"
          git push
