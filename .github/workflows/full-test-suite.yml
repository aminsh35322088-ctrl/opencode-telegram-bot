name: Full Test Suite

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to validate"
        required: false
        default: "main"
        type: string

permissions:
  contents: read

concurrency:
  group: full-test-suite-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Typecheck, Build, Test
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.14.0
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Verify pinned Core packages
        run: node scripts/verify-core-install.mjs

      - name: Install CI test runner
        run: npm install --no-save --package-lock=false vitest@3.2.4

      - name: Run Core routing and distributed boundary tests
        run: node --import tsx --test tests/*.test.ts

      - name: Materialize CI-only test suite
        run: |
          rm -rf ./tests
          mkdir -p ./tests
          cp -R .github/ci-tests/tests/. ./tests/

      - name: Lint
        run: |
          ./node_modules/.bin/eslint src --max-warnings=0
          ./node_modules/.bin/eslint tests --max-warnings=0

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: ./node_modules/.bin/vitest run --config .github/ci-tests/vitest.config.ts

      - name: Cleanup
        if: always()
        run: |
          rm -rf tests coverage node_modules/vitest node_modules/@vitest
