name: One-time code cleanup

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    if: "!contains(github.event.head_commit.message, '[cleanup-complete]')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14
          cache: npm

      - name: Remove audio-reply feature and clean up settings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, found {count}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "src/bot/services/event-subscription-service.ts",
              'import { sendTtsResponseForSession } from "../handlers/tts-response-handler.js";\n',
              "",
          )
          replace_once(
              "src/bot/services/event-subscription-service.ts",
              '''\n          await sendTtsResponseForSession({\n            api: botApi,\n            sessionId,\n            chatId,\n            text: messageText,\n          });''',
              "",
          )

          replace_once(
              "src/app/stores/settings-store.ts",
              '''\nexport type TtsMode = "off" | "all" | "auto";\n\nexport function getTtsMode(): TtsMode {\n  return currentSettings.ttsMode ?? "off";\n}\n\nexport function setTtsMode(mode: TtsMode): void {\n  currentSettings.ttsMode = mode;\n  void writeSettingsFile(currentSettings);\n}\n''',
              "",
          )
          replace_once("src/app/stores/settings-store.ts", '    "ttsMode",\n', "")
          replace_once(
              "src/app/stores/settings-store.ts",
              '''    if (key === "ttsMode") {\n      if (typeof value !== "string" || !VALID_TTS_MODES.includes(value as TtsMode)) {\n        throw new Error(\n          `INITIAL_SETTINGS_PRESET: invalid value for "ttsMode"; expected one of ${VALID_TTS_MODES.join(", ")}.`,\n        );\n      }\n      if (currentSettings.ttsMode === undefined) {\n        currentSettings.ttsMode = value as TtsMode;\n      }\n    } else if (key === "responseStreamingMode") {''',
              '''    if (key === "responseStreamingMode") {''',
          )
          replace_once("src/app/stores/settings-store.ts", 'const VALID_TTS_MODES: readonly TtsMode[] = ["off", "all", "auto"];\n', "")
          replace_once(
              "src/app/stores/settings-store.ts",
              '''\n  if ("ttsEnabled" in loadedSettings) {\n    const oldEnabled = (loadedSettings as Record<string, unknown>).ttsEnabled;\n    loadedSettings.ttsMode = oldEnabled === true ? "all" : "off";\n    delete (loadedSettings as Record<string, unknown>).ttsEnabled;\n    requiresRewrite = true;\n  }\n''',
              "",
          )

          replace_once("src/app/types/settings.ts", '  ttsMode?: "off" | "all" | "auto" | undefined;\n', "")

          replace_once("src/config.ts", 'export type TtsProvider = "openai" | "google" | "elevenlabs" | "edge";\n', "")
          p = Path("src/config.ts")
          text = p.read_text()
          start = text.index("const VALID_TTS_PROVIDERS:")
          end = text.index("const VALID_STT_REQUEST_FORMATS:")
          text = text[:start] + text[end:]
          old = '''  tts: (() => {\n    const provider = getOptionalTtsProviderEnvVar("TTS_PROVIDER", "openai");\n    const defaultVoice =\n      provider === "google"\n        ? "en-US-Studio-O"\n        : provider === "elevenlabs"\n          ? "21m00Tcm4TlvDq8ikWAM"\n          : provider === "edge"\n            ? "en-US-EmmaMultilingualNeural"\n            : "alloy";\n    const defaultModel =\n      provider === "elevenlabs" ? "eleven_flash_v2_5" : "gpt-4o-mini-tts";\n    return {\n      apiUrl: getEnvVar("TTS_API_URL", false),\n      apiKey: getEnvVar("TTS_API_KEY", false),\n      provider,\n      model: getEnvVar("TTS_MODEL", false) || defaultModel,\n      voice: getEnvVar("TTS_VOICE", false) || defaultVoice,\n    };\n  })(),\n'''
          if text.count(old) != 1:
              raise SystemExit(f"Expected exactly one TTS config block, found {text.count(old)}")
          p.write_text(text.replace(old, "", 1))

          for p in Path("src/i18n").glob("*.ts"):
              lines = p.read_text().splitlines(keepends=True)
              p.write_text("".join(line for line in lines if not any(marker in line for marker in (
                  '"status.line.tts"', '"status.tts.', '"tts.', '"settings.tts.label"'
              )))

          for filename in (".env.example", "README.md"):
              p = Path(filename)
              if p.exists():
                  p.write_text("".join(line for line in p.read_text().splitlines(keepends=True) if "TTS_" not in line))

          for filename in (
              "src/app/services/edge-tts.ts",
              "src/app/services/tts-service.ts",
              "src/bot/handlers/tts-response-handler.ts",
              "tests/app/services/edge-tts.test.ts",
              "tests/app/services/tts-service.test.ts",
              "tests/bot/handlers/tts-response-handler.test.ts",
          ):
              p = Path(filename)
              if p.exists():
                  p.unlink()
          PY

          npm uninstall @google-cloud/text-to-speech --ignore-scripts --no-audit --no-fund

          if grep -RInE 'TTS_|ttsMode|getTtsMode|setTtsMode|sendTts|tts-service|edge-tts|status\.tts|settings\.tts' src tests .env.example README.md --exclude-dir=node_modules --exclude-dir=.git; then
            echo "Stale TTS references remain."
            exit 1
          fi

      - name: Refactor settings callback navigation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("src/bot/callbacks/settings-callback-handler.ts")
          text = p.read_text()
          text = text.replace(
              'import type { Context } from "grammy";\n',
              'import type { Context } from "grammy";\nimport type { InlineKeyboard } from "grammy";\n',
          )
          text = text.replace(
              'import { buildAdvancedSettingsView, buildAppearanceSettingsView, buildContextSettingsView, buildNotificationsSettingsView, buildSettingsMenuView, SETTINGS_ADVANCED_CALLBACK, SETTINGS_APPEARANCE_CALLBACK, SETTINGS_ASSISTANT_FOOTER_CALLBACK, SETTINGS_BACK_CALLBACK, SETTINGS_CALLBACK_PREFIX, SETTINGS_COMPACT_OUTPUT_CALLBACK, SETTINGS_CONTEXT_CALLBACK, SETTINGS_DIFF_FILES_CALLBACK, SETTINGS_MODEL_CALLBACK, SETTINGS_NOTIFICATIONS_CALLBACK, SETTINGS_PROMPT_QUEUE_CALLBACK, SETTINGS_RESPONSE_STREAMING_CALLBACK, SETTINGS_THINKING_CONTENT_CALLBACK } from "../menus/settings-menu.js";',
              'import {\n  buildAdvancedSettingsView,\n  buildAppearanceSettingsView,\n  buildContextSettingsView,\n  buildNotificationsSettingsView,\n  buildSettingsMenuView,\n  SETTINGS_ADVANCED_CALLBACK,\n  SETTINGS_APPEARANCE_CALLBACK,\n  SETTINGS_ASSISTANT_FOOTER_CALLBACK,\n  SETTINGS_BACK_CALLBACK,\n  SETTINGS_CALLBACK_PREFIX,\n  SETTINGS_COMPACT_OUTPUT_CALLBACK,\n  SETTINGS_CONTEXT_CALLBACK,\n  SETTINGS_DIFF_FILES_CALLBACK,\n  SETTINGS_MODEL_CALLBACK,\n  SETTINGS_NOTIFICATIONS_CALLBACK,\n  SETTINGS_PROMPT_QUEUE_CALLBACK,\n  SETTINGS_RESPONSE_STREAMING_CALLBACK,\n  SETTINGS_THINKING_CONTENT_CALLBACK,\n} from "../menus/settings-menu.js";',
          )
          text = text.replace(
              'async function renderSettingsView(ctx: Context, view: { text: string; keyboard: import("grammy").InlineKeyboard }): Promise<void> {',
              'async function renderSettingsView(ctx: Context, view: { text: string; keyboard: InlineKeyboard }): Promise<void> {',
          )
          old = '''    if (callbackData === SETTINGS_COMPACT_OUTPUT_CALLBACK) {\n      setCompactOutputMode(!getCompactOutputMode());\n    } else if (callbackData === SETTINGS_THINKING_CONTENT_CALLBACK) {\n      setShowThinkingContent(!getShowThinkingContent());\n    } else if (callbackData === SETTINGS_RESPONSE_STREAMING_CALLBACK) {\n      setResponseStreamingMode(getNextResponseStreamingMode(getResponseStreamingMode()));\n    } else if (callbackData === SETTINGS_DIFF_FILES_CALLBACK) {\n      setSendDiffFileAttachments(!getSendDiffFileAttachments());\n    } else if (callbackData === SETTINGS_PROMPT_QUEUE_CALLBACK) {\n      setPromptQueueEnabled(!getPromptQueueEnabled());\n    } else if (callbackData === SETTINGS_ASSISTANT_FOOTER_CALLBACK) {\n      setShowAssistantRunFooter(!getShowAssistantRunFooter());\n    } else {\n      await ctx.answerCallbackQuery({ text: t("callback.processing_error") });\n      return true;\n    }\n\n    await ctx.answerCallbackQuery({ text: t("settings.saved") });\n    await renderSettingsView(ctx, buildAppearanceSettingsView());'''
          new = '''    let destination = buildAppearanceSettingsView;\n\n    if (callbackData === SETTINGS_COMPACT_OUTPUT_CALLBACK) {\n      setCompactOutputMode(!getCompactOutputMode());\n    } else if (callbackData === SETTINGS_THINKING_CONTENT_CALLBACK) {\n      setShowThinkingContent(!getShowThinkingContent());\n    } else if (callbackData === SETTINGS_RESPONSE_STREAMING_CALLBACK) {\n      setResponseStreamingMode(getNextResponseStreamingMode(getResponseStreamingMode()));\n    } else if (callbackData === SETTINGS_DIFF_FILES_CALLBACK) {\n      setSendDiffFileAttachments(!getSendDiffFileAttachments());\n    } else if (callbackData === SETTINGS_ASSISTANT_FOOTER_CALLBACK) {\n      setShowAssistantRunFooter(!getShowAssistantRunFooter());\n    } else if (callbackData === SETTINGS_PROMPT_QUEUE_CALLBACK) {\n      setPromptQueueEnabled(!getPromptQueueEnabled());\n      destination = buildNotificationsSettingsView;\n    } else {\n      await ctx.answerCallbackQuery({ text: t("callback.processing_error") });\n      return true;\n    }\n\n    await ctx.answerCallbackQuery({ text: t("settings.saved") });\n    await renderSettingsView(ctx, destination());'''
          if text.count(old) != 1:
              raise SystemExit("Settings callback toggle block was not found exactly once")
          p.write_text(text.replace(old, new, 1))
          PY

      - name: Format and validate
        run: |
          npx prettier --write "src/**/*.ts" "tests/**/*.ts"
          git diff --check
          npm ci
          npm run lint
          npm run typecheck
          npm run build
          npm run test

      - name: Commit validated cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore: remove legacy audio replies and harden settings navigation [cleanup-complete]"
          git push origin HEAD:main
          git rm .github/workflows/one-time-code-cleanup.yml
          git commit -m "chore: remove temporary cleanup workflow [cleanup-complete]"
          git push origin HEAD:main
