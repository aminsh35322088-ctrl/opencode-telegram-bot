name: Deploy to Railway

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: railway-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy tested main to Railway
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Resolve tested revision
        id: revision
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout tested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.revision.outputs.sha }}
          fetch-depth: 1

      - name: Require Railway token
        shell: bash
        env:
          RAILWAY_CI_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_CI_TOKEN" ]; then
            echo "::error::RAILWAY_TOKEN repository secret is not configured."
            exit 1
          fi

      - name: Prepare Railway source upload
        shell: bash
        run: |
          # The repository intentionally tracks this container-only absolute symlink.
          # Railway CLI's local source indexer cannot archive it reliably.
          rm -f node_modules

      - name: Deploy source to Railway
        shell: bash
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          npx -y @railway/cli@latest up \
            --project cc68b602-f68f-42f4-b8c4-da1b2fd79141 \
            --environment d0c30324-2558-44cb-84b7-c2635b5666f0 \
            --service 64a7b986-c2e0-4b52-9583-eee9557577f1 \
            --ci \
            --message "GitHub ${{ steps.revision.outputs.sha }}"
