          s = re.sub(r'  const requestedAgent = preferredAgent \?\? getCurrentAgent\(\) \?\? DEFAULT_AGENT;\n  const project = getCurrentProject\(\);\n\n  if \(!project\) \{\n    return requestedAgent;\n  \}\n', '  const requestedAgent = preferredAgent ?? getCurrentAgent() ?? DEFAULT_AGENT;\n', s, count=1)
          s = s.replace('project ${project.worktree}', 'session directory ${getCurrentSession()?.directory ?? "default"}')
          s = s.replace('  const project = getCurrentProject();\n\n  if (!project) {\n    // No active project, return stored agent from settings\n    return storedAgent ?? DEFAULT_AGENT;\n  }\n\n', '')
          s = s.replace('      directory: project.worktree,', '      directory: session.directory,')
          p.write_text(s, encoding='utf-8')

          # Start/command router wiring.
          replace_once('src/bot/routers/command-router.ts',
