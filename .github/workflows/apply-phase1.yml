name: Apply Phase 1

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.14
          cache: npm

      - name: Apply Phase 1 changes
        shell: python
        run: |
          from pathlib import Path
          import re

          ROOT = Path('.')

          def write(path, text):
              p = ROOT / path
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(text, encoding='utf-8')

          def replace_once(path, old, new):
              p = ROOT / path
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'pattern not found in {path}: {old[:160]!r}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')

          # New pause state is intentionally in-memory: it protects the active chat without
          # introducing another persisted cost/usage policy.
          write('src/app/managers/paused-session-manager.ts', '''import type { SessionInfo } from "../types/session.js";

let pausedSession: SessionInfo | null = null;

export function setPausedSession(session: SessionInfo): void {
  pausedSession = { ...session };
}

export function getPausedSession(): SessionInfo | null {
  return pausedSession ? { ...pausedSession } : null;
}

export function clearPausedSession(): void {
  pausedSession = null;
}

export function isChatPaused(sessionId?: string): boolean {
  if (!pausedSession) return false;
  return sessionId === undefined || pausedSession.id === sessionId;
}

export function __resetPausedSessionForTests(): void {
  pausedSession = null;
}
''')

          write('src/bot/commands/pause-command.ts', '''import type { Context, Bot } from "grammy";
import { opencodeClient } from "../../opencode/client.js";
import { getCurrentSession } from "../../app/services/session-service.js";
import { abortCurrentOperation } from "./abort-command.js";
import { keyboardManager } from "../keyboards/keyboard-manager.js";
import {
  clearPausedSession,
  getPausedSession,
  isChatPaused,
  setPausedSession,
} from "../../app/managers/paused-session-manager.js";
import { processUserPrompt, type ProcessPromptDeps } from "../handlers/prompt.js";
import { getStoredModel } from "../../app/services/model-selection-service.js";
import { formatModelForDisplay } from "../../app/types/model.js";
import { logger } from "../../utils/logger.js";
import { t } from "../../i18n/index.js";

const RESUME_PROMPT =
  "[resume] Continue the interrupted task from the current session state. Preserve completed work, inspect the current state, and continue only what remains. Do not restart completed work.";

export async function pauseCurrentChat(ctx: Context): Promise<void> {
  const session = getCurrentSession();
  if (!session) {
    await ctx.reply("ℹ️ There is no active chat to pause. Tap 💬 New Chat to start one.");
    return;
  }

  if (isChatPaused(session.id)) {
    await ctx.reply(t("pause.already"));
    return;
  }

  try {
    const { data, error } = await opencodeClient.session.status({ directory: session.directory });
    if (error) throw error;
    const state = (data as Record<string, { type?: string }> | undefined)?.[session.id];

    if (state?.type !== "busy") {
      await ctx.reply(t("pause.not_running"));
      return;
    }

    await abortCurrentOperation(ctx, { notifyUser: false });

    const { data: after, error: afterError } = await opencodeClient.session.status({
      directory: session.directory,
    });
    const finalState = (after as Record<string, { type?: string }> | undefined)?.[session.id];

    if (afterError || finalState?.type === "busy") {
      await ctx.reply(t("pause.failed"));
      return;
    }

    setPausedSession(session);
    keyboardManager.setPaused(true);

    const model = getStoredModel();
    const displayModel = formatModelForDisplay(model.providerID, model.modelID);
    await ctx.reply(
      [
        "⏸️ <b>Chat paused</b>",
        "",
        `💬 ${session.title}`,
        `🤖 ${displayModel}`,
        "",
        "The current run was interrupted safely. Your session, files, and history are still intact.",
        "",
        "You can change provider/model or recharge your API, then tap <b>▶️ Resume</b>.",
      ].join("\\n"),
      { parse_mode: "HTML", reply_markup: keyboardManager.getKeyboard() },
    );
  } catch (error) {
    logger.error("[Pause] Failed to pause current chat:", error);
    await ctx.reply(t("pause.failed"));
  }
}

export async function resumePausedChat(
  ctx: Context,
  deps: ProcessPromptDeps,
): Promise<void> {
  const session = getPausedSession();
  if (!session) {
    await ctx.reply(t("resume.none"));
    return;
  }

  if (getCurrentSession()?.id !== session.id) {
    await ctx.reply("⚠️ The paused chat is no longer the active chat. Open it from 🕘 History first.");
    return;
  }

  clearPausedSession();
  keyboardManager.setPaused(false);

  try {
    const dispatched = await processUserPrompt(ctx, RESUME_PROMPT, deps);
    if (!dispatched) {
      setPausedSession(session);
      keyboardManager.setPaused(true);
      return;
    }

    const model = getStoredModel();
    const displayModel = formatModelForDisplay(model.providerID, model.modelID);
    await ctx.reply(`▶️ Resuming <b>${session.title}</b> with <b>${displayModel}</b>.`, {
      parse_mode: "HTML",
      reply_markup: keyboardManager.getKeyboard(),
    });
  } catch (error) {
    setPausedSession(session);
    keyboardManager.setPaused(true);
    logger.error("[Resume] Failed to resume paused chat:", error);
    await ctx.reply(t("resume.failed"));
  }
}

export function cancelPausedChat(): void {
  clearPausedSession();
  keyboardManager.setPaused(false);
}
''')

          # Keyboard types / builder / manager.
          replace_once('src/bot/keyboards/keyboard-types.ts',
