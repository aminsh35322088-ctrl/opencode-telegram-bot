      - name: Verify
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run build
          npm run test

      - name: Commit changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: ship phase 1 UX and pause controls [skip ci]"
          git push
