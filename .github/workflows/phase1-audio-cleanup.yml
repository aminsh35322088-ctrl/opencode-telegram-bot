name: Phase 1 - Audio cleanup

on:
  push:
    branches: [phase1/final-cleanup]
    paths:
      - .github/workflows/phase1-audio-cleanup.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    if: "!contains(github.event.head_commit.message, '[audio-cleanup-done]')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14
          cache: npm

      - name: Remove remaining TTS surface
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def remove_lines(path: str, needles: tuple[str, ...]) -> None:
              p = Path(path)
              if not p.exists():
                  return
              lines = p.read_text().splitlines(keepends=True)
              p.write_text("".join(line for line in lines if not any(n in line for n in needles)))

          def remove_tests(path: str, needles: tuple[str, ...]) -> None:
              p = Path(path)
              if not p.exists():
                  return
              lines = p.read_text().splitlines(keepends=True)
              out: list[str] = []
              i = 0
              while i < len(lines):
                  line = lines[i]
                  stripped = line.lstrip()
                  if stripped.startswith(("it(", "it.each(", "  it(", "  it.each(")):
                      depth = 0
                      found = False
                      j = i
                      while j < len(lines):
                          current = lines[j]
                          if any(n.lower() in current.lower() for n in needles):
                              found = True
                          depth += current.count("{") - current.count("}")
                          if j > i and depth <= 0 and current.strip() == "});":
                              break
                          j += 1
                      if j >= len(lines):
                          raise SystemExit(f"Could not find end of test block in {path} starting at line {i + 1}")
                      if found:
                          i = j + 1
                          continue
                  out.append(line)
                  i += 1
              p.write_text("".join(out))

          # Runtime, persistence, configuration.
          remove_lines("src/bot/services/event-subscription-service.ts", ("sendTtsResponseForSession",))
          remove_lines("src/app/stores/settings-store.ts", ("TtsMode", "getTtsMode", "setTtsMode", '"ttsMode"'))
          remove_lines("src/app/types/settings.ts", ('ttsMode?:',))
          remove_lines("src/config.ts", ("TtsProvider", "VALID_TTS_PROVIDERS", "TTS_API", "TTS_PROVIDER", "TTS_MODEL", "TTS_VOICE", "  tts:"))

          # Docs/localization. STT is intentionally preserved.
          remove_lines(".env.example", ("TTS_",))
          remove_lines("README.md", ("TTS_",))
          locale_needles = ('"status.line.tts"', '"status.tts.', '"tts.', '"settings.tts.label"')
          for p in Path("src/i18n").glob("*.ts"):
              remove_lines(str(p), locale_needles)

          # Remove only test cases that specifically exercise generated audio/TTS.
          remove_tests("tests/config.test.ts", ("TTS", "ElevenLabs", "config.tts"))
          remove_tests("tests/app/stores/settings-store.test.ts", ("getTtsMode", "setTtsMode", "ttsMode", "ttsEnabled"))
          remove_tests("tests/bot/commands/settings.test.ts", ("SETTINGS_TTS_CALLBACK", "getTtsMode", "setTtsMode", "Audio replies"))
          remove_tests("tests/runtime/bootstrap.test.ts", ("TTS_",))
          remove_lines("tests/config.test.ts", ("TTS_PROVIDER", "TTS_API_URL", "TTS_API_KEY", "TTS_MODEL", "TTS_VOICE", "config.tts"))
          remove_lines("tests/app/stores/settings-store.test.ts", ("getTtsMode", "setTtsMode", "ttsMode", "ttsEnabled"))
          remove_lines("tests/bot/commands/settings.test.ts", ("SETTINGS_TTS_CALLBACK", "getTtsMode", "setTtsMode", "settings.tts.label", "status.tts."))
          remove_lines("tests/runtime/bootstrap.test.ts", ("TTS_",))

          for filename in (
              "src/app/services/edge-tts.ts",
              "src/app/services/tts-service.ts",
              "src/bot/handlers/tts-response-handler.ts",
              "tests/app/services/edge-tts.test.ts",
              "tests/app/services/tts-service.test.ts",
              "tests/bot/handlers/tts-response-handler.test.ts",
          ):
              p = Path(filename)
              if p.exists():
                  p.unlink()
          PY

          npm uninstall @google-cloud/text-to-speech --ignore-scripts --no-audit --no-fund

          echo '--- Remaining TTS references ---'
          ! grep -RInE 'TTS_|ttsMode|getTtsMode|setTtsMode|sendTts|text_and_tts|tts-service|edge-tts|status\.tts|settings\.tts' src tests package.json package-lock.json .env.example README.md --exclude-dir=node_modules --exclude-dir=.git

      - name: Validate cleaned tree
        run: |
          git diff --check
          npm ci
          npm run lint
          npm run typecheck
          npm run build
          npm run test

      - name: Commit cleanup and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore(phase1): remove legacy audio replies [audio-cleanup-done]"
          git rm .github/workflows/phase1-audio-cleanup.yml
          git commit -m "chore(phase1): remove temporary cleanup workflow [audio-cleanup-done]"
          git push origin HEAD:phase1/final-cleanup
