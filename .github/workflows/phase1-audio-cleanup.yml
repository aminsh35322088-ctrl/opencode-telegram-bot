name: Phase 1 - Audio cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/phase1-audio-cleanup.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    if: "!contains(github.event.head_commit.message, '[audio-cleanup-done]')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14
          cache: npm

      - name: Remove TTS runtime and configuration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def rewrite(path: str, pattern: str, replacement: str, flags: int = re.MULTILINE | re.DOTALL):
              p = Path(path)
              text = p.read_text()
              new, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match for cleanup block, found {count}")
              p.write_text(new)

          # settings-store: remove TTS state, getters/setters and legacy migration.
          rewrite(
              "src/app/stores/settings-store.ts",
              r'export type TtsMode = "off" \| "all" \| "auto";.*?export function getCompactOutputMode',
              'export function getCompactOutputMode',
          )
          rewrite(
              "src/app/stores/settings-store.ts",
              r'\nconst VALID_TTS_MODES: readonly TtsMode\[\] = \["off", "all", "auto"\];',
              '',
          )
          rewrite(
              "src/app/stores/settings-store.ts",
              r'"ttsMode",\n',
              '',
          )
          rewrite(
              "src/app/stores/settings-store.ts",
              r'\n    if \(key === "ttsMode"\) \{.*?\n    \} else if \(key === "responseStreamingMode"\) \{',
              '\n    if (key === "responseStreamingMode") {',
          )
          rewrite(
              "src/app/stores/settings-store.ts",
              r'\n  if \("ttsEnabled" in loadedSettings\) \{.*?\n  \}\n',
              '\n',
          )

          # settings type.
          rewrite("src/app/types/settings.ts", r'  ttsMode\?: "off" \| "all" \| "auto" \| undefined;\n', '')

          # config: provider type + validators + TTS block.
          rewrite("src/config.ts", r'export type TtsProvider = "openai" \| "google" \| "elevenlabs" \| "edge";\n', '')
          rewrite(
              "src/config.ts",
              r'\nconst VALID_TTS_PROVIDERS: TtsProvider\[\] = \["openai", "google", "elevenlabs", "edge"\];.*?\nconst VALID_STT_REQUEST_FORMATS:',
              '\nconst VALID_STT_REQUEST_FORMATS:',
          )
          rewrite("src/config.ts", r'\n  tts: \(\(\) => \{.*?\n  \}\)\(\),\n', '')

          # prompt: TTS is no longer a response mode. Keep the same function contract without options.
          rewrite("src/bot/handlers/prompt.ts", r'import \{ getCurrentProject, getTtsMode \} from "../../app/stores/settings-store.js";', 'import { getCurrentProject } from "../../app/stores/settings-store.js";')
          rewrite("src/bot/handlers/prompt.ts", r'\nexport type PromptResponseMode = "text_only" \| "text_and_tts";\n\ntype ProcessPromptOptions = \{\n  responseMode\?: PromptResponseMode;\n\};\n', '\n')
          rewrite("src/bot/handlers/prompt.ts", r'\nexport function setPromptResponseMode\(sessionId: string, responseMode: PromptResponseMode\): void \{.*?export function consumePromptResponseMode', '\nexport function consumePromptResponseMode')
          rewrite("src/bot/handlers/prompt.ts", r'export function consumePromptResponseMode\(sessionId: string\): PromptResponseMode \| null \{\n  const responseMode = promptResponseModes\.get\(sessionId\) \?\? null;\n  promptResponseModes\.delete\(sessionId\);\n  return responseMode;\n\}\n', '')
          rewrite("src/bot/handlers/prompt.ts", r'const promptResponseModes = new Map<string, PromptResponseMode>\(\);\n', '')
          rewrite("src/bot/handlers/prompt.ts", r'export function clearPromptResponseMode\(sessionId: string\): void \{\n  promptResponseModes\.delete\(sessionId\);\n\}\n', '')
          rewrite("src/bot/handlers/prompt.ts", r'  options: ProcessPromptOptions = \{\},\n', '')
          rewrite("src/bot/handlers/prompt.ts", r'  const responseMode =\n    options\.responseMode \?\? \(getTtsMode\(\) === "all" \? "text_and_tts" : "text_only"\);\n\n', '')
          rewrite("src/bot/handlers/prompt.ts", r'\n    setPromptResponseMode\(currentSession\.id, responseMode\);\n', '')
          rewrite("src/bot/handlers/prompt.ts", r'\n        clearPromptResponseMode\(currentSession\.id\);', '')
          rewrite("src/bot/handlers/prompt.ts", r'\n        clearPromptResponseMode\(currentSession\.id\);', '')

          # voice: STT remains; generated audio replies do not.
          rewrite("src/bot/handlers/voice-handler.ts", r'import \{ getTtsMode \} from "../../app/stores/settings-store.js";\n', '')
          rewrite("src/bot/handlers/voice-handler.ts", r',\n    options\?: \{ responseMode\?: "text_only" \| "text_and_tts" \}\n', '\n')
          rewrite("src/bot/handlers/voice-handler.ts", r'\n    const currentTtsMode = getTtsMode\(\);\n    const responseMode =\n      currentTtsMode === "all" \|\| currentTtsMode === "auto" \? "text_and_tts" : "text_only";\n    await processPrompt\(ctx, textForLLM, deps, \[\], \{ responseMode \}\);', '\n    await processPrompt(ctx, textForLLM, deps, []);')

          # status: remove audio reply status line.
          rewrite("src/bot/commands/status-command.ts", r'import \{ getTtsMode \} from "../../app/stores/settings-store.js";\n', '')
          rewrite("src/bot/commands/status-command.ts", r'\n    const ttsMode = getTtsMode\(\);\n    message \+= `\$\{t\("status\.line\.tts", \{\n      tts:\n        ttsMode === "off"\n          \? t\("status\.tts\.off"\)\n          : ttsMode === "all"\n            \? t\("status\.tts\.all"\)\n            : t\("status\.tts\.auto"\),\n    \}\)}\\n`;\n', '\n')

          # event subscription: no synthesized audio response.
          rewrite("src/bot/services/event-subscription-service.ts", r'import \{ sendTtsResponseForSession \} from "\.\./handlers/tts-response-handler\.js";\n', '')
          rewrite("src/bot/services/event-subscription-service.ts", r'\n\s*await sendTtsResponseForSession\(\{\n\s*api: botApi,\n\s*sessionId,\n\s*chatId,\n\s*text: messageText,\n\s*\}\);', '')
          PY

          npm uninstall @google-cloud/text-to-speech --ignore-scripts --no-audit --no-fund

          grep -RInE 'TTS_|ttsMode|getTtsMode|setTtsMode|sendTts|text_and_tts|tts-service|edge-tts|status\.tts|settings\.tts' src package.json package-lock.json .env.example README.md --exclude-dir=node_modules --exclude-dir=.git || true

      - name: Commit cleanup candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --check
          if git diff --cached --quiet; then
            echo "No cleanup changes detected"
            exit 1
          fi
          git commit -m "chore(phase1): remove legacy audio replies [audio-cleanup-done]"
          git push origin HEAD:main
