name: Fix merged interaction build
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch and verify build
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/bot/services/event-subscription-service.ts')
          s = p.read_text()

          client_import = 'import { opencodeClient } from "../../opencode/client.js";'
          if client_import not in s:
              anchor = 'import { stopEventListening, subscribeToEvents } from "../../opencode/events.js";'
              if anchor not in s:
                  raise SystemExit('events import anchor not found')
              s = s.replace(anchor, anchor + '\n' + client_import, 1)

          pattern = re.compile(
              r'\s*const currentProject = getCurrentProject\(\);\n'
              r'\s*const currentSessionForReject = getCurrentSession\(\);\n'
              r'\s*const directoryForReject =\n'
              r'\s*currentSessionForReject\?\.directory \?\? currentProject\?\.worktree;'
          )
          s, count = pattern.subn('\n        const directoryForReject = currentSession.directory;', s, count=1)
          if count == 0 and 'const directoryForReject = currentSession.directory;' not in s:
              raise SystemExit('question replacement directory block not found')
          p.write_text(s)
          PY
          npm ci
          npm run build
      - name: Commit source fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/bot/services/event-subscription-service.ts
          git diff --cached --quiet || git commit -m "fix: correct question replacement dependencies"
          git push
      - name: Remove temporary workflow
        run: |
          rm -f .github/workflows/_fix-build.yml
          git add .github/workflows/_fix-build.yml
          git diff --cached --quiet || git commit -m "chore: remove temporary build fix workflow"
          git push