name: Fix merged interaction build
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
      - name: Patch imports and project lookup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/bot/services/event-subscription-service.ts')
          s = p.read_text()

          client_import = 'import { opencodeClient } from "../../opencode/client.js";'
          events_import = 'import { stopEventListening, subscribeToEvents } from "../../opencode/events.js";'
          if client_import not in s:
              if events_import not in s:
                  raise SystemExit('events import anchor not found')
              s = s.replace(events_import, events_import + '\n' + client_import, 1)

          old = '''        const currentProject = getCurrentProject();
        const currentSessionForReject = getCurrentSession();
        const directoryForReject =
          currentSessionForReject?.directory ?? currentProject?.worktree;'''
          new = '''        const directoryForReject = currentSession.directory;'''
          if old in s:
              s = s.replace(old, new, 1)
          elif 'const directoryForReject = currentSession.directory;' not in s:
              raise SystemExit('question replacement directory block not found')

          p.write_text(s)
          PY
          npm ci
          npm run build
      - name: Commit and push fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/bot/services/event-subscription-service.ts
          git diff --cached --quiet || git commit -m "fix: correct question replacement dependencies"
          git push
      - name: Remove temporary workflow
        run: |
          rm -f .github/workflows/_fix-build.yml
          git add .github/workflows/_fix-build.yml
          git diff --cached --quiet || git commit -m "chore: remove temporary build fix workflow"
          git push