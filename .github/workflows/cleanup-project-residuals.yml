name: Cleanup project residuals

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    steps:
      - uses: actions/checkout@v4

      - name: Apply project removal cleanup
        shell: python
        run: |
          from pathlib import Path
          
          def edit(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f"pattern not found in {path}: {old[:120]!r}")
              p.write_text(s.replace(old, new, 1))
          
          # History/session selection: use the session directory itself; never require a project.
          edit(
              'src/bot/callbacks/session-callback-handler.ts',
              'import { getCurrentProject } from "../../app/stores/settings-store.js";\n',
              'import { getCurrentSessionDirectory, getCurrentSession } from "../../app/services/session-service.js";\n'
          )
          edit(
              'src/bot/callbacks/session-callback-handler.ts',
              '''  const currentProject = getCurrentProject();\n\n  if (!currentProject) {\n    clearAllInteractionState("session_select_project_missing");\n    await alert(ctx, "sessions.select_project_first");\n    return;\n  }\n\n  const { data: session, error } = await opencodeClient.session.get({\n    sessionID: sessionId,\n    directory: currentProject.worktree,\n  });''',
              '''  const directory = getCurrentSessionDirectory();\n\n  const { data: session, error } = await opencodeClient.session.get({\n    sessionID: sessionId,\n    directory,\n  });'''
          )
          edit(
              'src/bot/callbacks/session-callback-handler.ts',
              'project=${currentProject.worktree}',
              'directory=${directory}'
          )
          edit(
              'src/bot/callbacks/session-callback-handler.ts',
              'directory: currentProject.worktree,',
              'directory,'
          )
          edit(
              'src/bot/callbacks/session-callback-handler.ts',
              '            currentProject.worktree,',
              '            sessionInfo.directory,'
          )
          edit(
              'src/bot/callbacks/session-callback-handler.ts',
              '        task: () => sendLatestAssistantResponse(ctx.api, chatId, session.id, currentProject.worktree),',
              '        task: () => sendLatestAssistantResponse(ctx.api, chatId, session.id, sessionInfo.directory),'
          )
          edit(
              'src/bot/callbacks/session-callback-handler.ts',
              '''    const currentProject = getCurrentProject();\n\n    if (!currentProject) {\n      clearAllInteractionState("session_select_project_missing");\n      await alert(ctx, "sessions.select_project_first");\n      return true;\n    }\n\n    if (page !== null) {''',
              '''    const directory = getCurrentSessionDirectory();\n\n    if (page !== null) {'''
          )
          edit(
              'src/bot/callbacks/session-callback-handler.ts',
              'const pageData = await loadSessionPage(currentProject.worktree, page, pageSize);',
              'const pageData = await loadSessionPage(directory, page, pageSize);'
          )
          
          # messages command: current session is the source of truth.
          edit(
              'src/bot/commands/messages-command.ts',
              'import { getCurrentProject } from "../../app/stores/settings-store.js";\n',
              ''
          )
          edit(
              'src/bot/commands/messages-command.ts',
              '''    const currentProject = getCurrentProject();\n    if (!currentProject) {\n      await ctx.reply(t("messages.project_not_selected"));\n      return;\n    }\n\n    const currentSession = getCurrentSession();\n    if (!currentSession) {\n      await ctx.reply(t("messages.session_not_selected"));\n      return;\n    }\n\n    if (currentSession.directory !== currentProject.worktree) {\n      await ctx.reply(t("messages.session_project_mismatch"));\n      return;\n    }''',
              '''    const currentSession = getCurrentSession();\n    if (!currentSession) {\n      await ctx.reply(t("messages.session_not_selected"));\n      return;\n    }'''
          )
          edit(
              'src/bot/commands/messages-command.ts',
              'projectDirectory: currentProject.worktree,',
              'sessionDirectory: currentSession.directory,'
          )
          
          # Startup restore: current session alone is enough.
          edit(
              'src/app/services/attach-service.ts',
              'import { getCurrentProject } from "../stores/settings-store.js";\n',
              ''
          )
          edit(
              'src/app/services/attach-service.ts',
              '''  const currentProject = getCurrentProject();\n  const currentSession = getCurrentSession();\n\n  if (!currentProject || !currentSession) {\n    return false;\n  }\n\n  if (currentSession.directory !== currentProject.worktree) {\n    logger.warn(\n      `[Attach] Skipping auto-restore because project/session mismatch: sessionDirectory=${currentSession.directory}, projectDirectory=${currentProject.worktree}`,\n    );\n    return false;\n  }''',
              '''  const currentSession = getCurrentSession();\n\n  if (!currentSession) {\n    return false;\n  }'''
          )
          
          # File browser root follows current session directory; no project selection required.
          edit(
              'src/app/services/file-browser-service.ts',
              'import { getCurrentProject } from "../stores/settings-store.js";\n',
              'import { getCurrentSession } from "./session-service.js";\n'
          )
          edit(
              'src/app/services/file-browser-service.ts',
              '''export function getProjectRoot(): string | null {\n  return getCurrentProject()?.worktree ?? null;\n}''',
              '''export function getProjectRoot(): string | null {\n  return getCurrentSession()?.directory ?? null;\n}'''
          )
          
          # Status should not display a project at all.
          edit(
              'src/bot/commands/status-command.ts',
              'import { getCurrentProject, getTtsMode } from "../../app/stores/settings-store.js";',
              'import { getTtsMode } from "../../app/stores/settings-store.js";'
          )
          start = '    const currentProject = getCurrentProject();\n'
          end = '    const currentSession = getCurrentSession();\n'
          p = Path('src/bot/commands/status-command.ts')
          s = p.read_text()
          i = s.index(start)
          j = s.index(end, i)
          s = s[:i] + end + s[j + len(end):]
          p.write_text(s)
          
          # Remove project-only wording from the visible translation keys that remain used.
          p = Path('src/i18n/locales/en.ts') if Path('src/i18n/locales/en.ts').exists() else Path('src/i18n/en.ts')
          if p.exists():
              s = p.read_text()
              s = s.replace('  "status.project_selected": "Project: {project}",\n', '')
              s = s.replace('  "status.worktree_selected": "Worktree: {worktree}",\n', '')
              s = s.replace('  "status.project_not_selected": "Project: not selected",\n', '')
              s = s.replace('  "status.project_hint": "Use /projects to select a project",\n', '')
              s = s.replace('Use /projects to select a project', 'Use History to select a chat')
              p.write_text(s)
          
          # Clean visible project references from help/start strings if present.
          for p in Path('src').rglob('*.ts'):
              s = p.read_text()
              s = s.replace('/projects — select project\\n', '')
              s = s.replace('/projects.\\n', '')
              s = s.replace('/projects.', 'History.')
              p.write_text(s)
          
          # Remove this one-shot workflow before committing the cleanup.
          Path('.github/workflows/cleanup-project-residuals.yml').unlink()

      - name: Verify build
        run: npm ci && npm run build

      - name: Commit cleanup
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: remove project selection runtime dependency [skip ci]"
          git push
