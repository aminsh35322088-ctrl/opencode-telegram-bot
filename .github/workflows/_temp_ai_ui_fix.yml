name: apply-ai-ui-fix
on:
  push:
    paths:
      - 'src/bot/keyboards/main-reply-keyboard.ts'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply AI Topic UI fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          settings = Path('src/bot/menus/settings-menu.ts')
          text = settings.read_text()
          old = '''        "🧵 <b>Topic Settings</b>",
        "",
        "🎯 <b>Customize this Topic</b>",
        "These settings apply only here.",
        "",
        `🤖 <b>Model</b> · ${model}`,
        `🧑‍💻 <b>Agent</b> · ${agent}`,
        `🎛 <b>Variant</b> · ${variant}`,
        "",
        "💬 <b>Response</b> · Output, thinking & delivery",
        `📥 <b>Prompt Queue</b> · ${statusPill(getPromptQueueEnabled())}`,
        "🧠 <b>Context</b> · Usage & window health",'''
          new = '''        "🧵 <b>Topic Settings</b>",
        "",
        "⚙️ <b>Customize this Topic</b>",
        "Choose how this Topic thinks and responds.",
        "",
        "🤖 <b>Model</b>",
        `<code>${model}</code>`,
        "",
        `🧑‍💻 <b>Agent</b> · ${agent}`,
        `🎛 <b>Variant</b> · ${variant}`,
        "",
        "💬 <b>Response</b> · Output & thinking",
        `📥 <b>Prompt Queue</b> · ${statusPill(getPromptQueueEnabled())}`,
        "🧠 <b>Context Health</b> · Usage & window",'''
          if old not in text:
              print('settings root block not found', file=sys.stderr); sys.exit(1)
          settings.write_text(text.replace(old, new, 1))
          router = Path('src/bot/callbacks/callback-router.ts')
          text = router.read_text()
          imp = 'import { getMainNavigationMessageId } from "../../app/stores/settings-store.js";\n'
          if imp not in text:
              print('callback import anchor not found', file=sys.stderr); sys.exit(1)
          if 'hasActiveImageAiProvider' not in text:
              text = text.replace(imp, imp + 'import { hasActiveImageAiProvider } from "../../app/services/image-ai-provider-service.js";\n', 1)
          old = '''async function handleImageAiCallback(ctx: Context, data: string): Promise<boolean> {
  const sessionId = await resolveCallbackTopicSession(ctx) ?? getCurrentSession()?.id;
  if (data === "imageai:generate") { activateImageMode("generate", sessionId); clearInteractionErrorState("interaction", "image_ai_mode_selected"); await ctx.answerCallbackQuery().catch(() => {}); await ctx.editMessageText("🎨 <b>Image AI · Generate</b>\\n\\nSend a text or voice prompt and I’ll generate a new image.", { parse_mode: "HTML" }).catch(() => {}); return true; }
  if (data === "imageai:edit") { activateImageMode("edit", sessionId); clearInteractionErrorState("interaction", "image_ai_mode_selected"); await ctx.answerCallbackQuery().catch(() => {}); await ctx.editMessageText("🖌️ <b>Image AI · Edit</b>\\n\\nSend a photo with a caption/instruction, or send a photo first and then the edit instruction.", { parse_mode: "HTML" }).catch(() => {}); return true; }
  return false;
}'''
          new = '''async function handleImageAiCallback(ctx: Context, data: string): Promise<boolean> {
  const sessionId = await resolveCallbackTopicSession(ctx) ?? getCurrentSession()?.id;
  if (data === "imageai:generate") {
    if (!(await hasActiveImageAiProvider("generate"))) {
      await ctx.answerCallbackQuery({ text: "image ai not configured", show_alert: true }).catch(() => {});
      return true;
    }
    activateImageMode("generate", sessionId);
    clearInteractionErrorState("interaction", "image_ai_mode_selected");
    await ctx.answerCallbackQuery().catch(() => {});
    await ctx.editMessageText("🎨 <b>Image AI · Generate</b>\\n\\nSend a text or voice prompt and I’ll generate a new image.", { parse_mode: "HTML" }).catch(() => {});
    return true;
  }
  if (data === "imageai:edit") {
    if (!(await hasActiveImageAiProvider("edit"))) {
      await ctx.answerCallbackQuery({ text: "image ai not configured", show_alert: true }).catch(() => {});
      return true;
    }
    activateImageMode("edit", sessionId);
    clearInteractionErrorState("interaction", "image_ai_mode_selected");
    await ctx.answerCallbackQuery().catch(() => {});
    await ctx.editMessageText("🖌️ <b>Image AI · Edit</b>\\n\\nSend a photo with a caption/instruction, or send a photo first and then the edit instruction.", { parse_mode: "HTML" }).catch(() => {});
    return true;
  }
  return false;
}'''
          if old not in text:
              print('image callback block not found', file=sys.stderr); sys.exit(1)
          router.write_text(text.replace(old, new, 1))
          kbtest = Path('.github/ci-tests/tests/bot/keyboards/main-reply-keyboard.test.ts')
          text = kbtest.read_text()
          old = '''    expect(keyboard.keyboard.filter((row) => row.length > 0)).toEqual([
      [{ text: "⏸️ Pause" }, { text: "🛑 Abort" }],
      [{ text: "🎨 Image AI" }],
      [{ text: "🧠 GPT 4o" }],
      [{ text: "⚙️ Topic Settings" }, { text: "🗑️ Delete Chat" }],
    ]);'''
          new = '''    expect(keyboard.keyboard.filter((row) => row.length > 0)).toEqual([
      [{ text: "⏸️ Pause" }, { text: "🛑 Abort" }],
      [{ text: "🎨 Image AI" }],
      [{ text: "🗑️ Delete Chat" }, { text: "📦 Compact: ON" }],
      [{ text: "🧠 GPT 4o" }, { text: "⚙️ Topic Settings" }],
    ]);'''
          if old not in text:
              print('keyboard expected block not found', file=sys.stderr); sys.exit(1)
          text = text.replace(old, new, 1)
          marker = '''  it("creates custom agent keyboard and remove payload", () => {'''
          extra = '''  it("always includes Image AI in an idle AI Topic keyboard", () => {
    const keyboard = createMainKeyboard(
      { providerID: "openrouter", modelID: "openai/gpt-4o" },
      { compactOutputMode: false, isTopic: true },
    );
    expect(keyboard.keyboard.flat().map(getButtonText)).toContain("🎨 Image AI");
  });

'''
          if marker not in text:
              print('test insertion marker not found', file=sys.stderr); sys.exit(1)
          kbtest.write_text(text.replace(marker, extra + marker, 1))
          print('AI UI fixes applied')
          PY
      - name: Verify diff
        run: git diff --check
      - name: Commit and cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/bot/menus/settings-menu.ts src/bot/keyboards/main-reply-keyboard.ts src/bot/callbacks/callback-router.ts .github/ci-tests/tests/bot/keyboards/main-reply-keyboard.test.ts
          git rm .github/workflows/_temp_ai_ui_fix.yml
          git commit -m "fix: polish AI Topic settings and Image AI control"
          git push
